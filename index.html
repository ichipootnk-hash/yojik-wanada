  <script>
/* ===== 記事データ ===== */
const posts = [
  {
    date: "2025.4.27",
    title: "【アルバム全５作品　サブスクリリース】",
    comment: "最新作「シーセイ」含む、全６作品が各種サブスクリリース。",
    img: "picture/subscribe-pic.png",
    link: "detail1.html"
  },
  {
    date: "2025.4.27",
    title: "【6年ぶりの新譜『シーセイ』2025年4月27日発売】",
    comment: "６年ぶり、5枚目のフルアルバム「シーセイ」がCDでリリース。緻密なポップ・サウンドから不可思議なインスト楽曲、宅録を活かした多彩な楽器の使用、そして大胆な打ち込みの導入など yojikとwandaの現時点での集大成となる全14曲を収録。歌詞のイメージを散りばめた印象的なジャケットは、広告や装丁イラストでも活躍する富山在住のイラストレーターおざわさよこ氏とデザイナー高森崇史（T&K）氏によるもの。",
    img: "picture/she-say_jacket-pic.jpeg",
    link: "detail2.html"
  },
  {
    date: "2023.11.10",
    title: "【ドキュメンタリー映画「映画の朝ごはん」音楽担当】",
    comment: "食と映画。二つの交わりを描いた”ひと味違った”ドキュメンタリー<br>ー映画に写らないもののすべてー",
    img: "picture/eiganoasagohan-key.jpg",
    link: "detail1.html"
  },
];

/* perpage1ページに表示する記事数　currentpage今どのページか */
const perPage = 3;
let currentPage = 1;

/* ===== 記事描画 ===== */
function renderPosts(page) {
  const start = (page - 1) * perPage;
  const end = start + perPage;

  const html = posts.slice(start, end).map(post => `
  <a href="${post.link}" class="post">
    <div class="post-left">
      <div class="date">${post.date}</div>
      <div class="title">${post.title}</div>
      <div class="comment">${post.comment}</div>
    </div>
    <div class="post-right">
      <img src="${post.img}">
    </div>
  </a>
`).join("");

  document.getElementById("posts").innerHTML = html;
}

/* ===== ページネーション ===== */
function renderPagination() {
  const totalPages = Math.ceil(posts.length / perPage);
  let html = "";

  if (currentPage > 1) {
    html += `<button onclick="go(${currentPage - 1})">←</button>`;
  }

  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === currentPage ? 'active' : ''}" onclick="go(${i})">${i}</button>`;
  }

  if (currentPage < totalPages) {
    html += `<button onclick="go(${currentPage + 1})">→</button>`;
  }

  document.getElementById("pagination").innerHTML = html;
}

/* ===== ページ切り替え ===== */
function go(page) {
  currentPage = page;
  renderPosts(page);
  renderPagination();
}

/* 初期表示 */
renderPosts(currentPage);
renderPagination();
</script>
